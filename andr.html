<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cập nhật bắt buộc · Tumadam Mod</title>
<style>
  :root{
    --bg:#0A0E14;
    --surface:#121826;
    --surface-2:#1A2333;
    --line:#232E42;
    --cyan:#22D3EE;
    --amber:#FFB020;
    --red:#FF5D5D;
    --green:#3DDC84;
    --text:#E7EDF5;
    --muted:#8B97AC;
    --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --sans:'Space Grotesk', 'Inter', system-ui, sans-serif;
    --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(34,211,238,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--body);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    overflow:hidden;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:32px 24px 28px;
    position:relative;
    box-shadow:0 40px 80px -20px rgba(0,0,0,0.6);
  }

  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--amber);
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:22px;
  }
  .eyebrow::before, .eyebrow::after{
    content:'';
    width:14px; height:1px;
    background:var(--line);
  }

  /* ---- signature: radar ping behind app icon ---- */
  .icon-wrap{
    position:relative;
    width:104px; height:104px;
    margin:0 auto 22px;
    display:flex; align-items:center; justify-content:center;
  }
  .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid rgba(34,211,238,0.35);
    animation:ping 2.4s cubic-bezier(0.2,0.7,0.3,1) infinite;
  }
  .ring.r2{ animation-delay:0.8s; }
  .ring.r3{ animation-delay:1.6s; }
  @keyframes ping{
    0%{ transform:scale(0.55); opacity:0.9; }
    100%{ transform:scale(1.45); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .ring{ animation:none; opacity:0.25; }
  }
  .icon-core{
    width:72px; height:72px;
    border-radius:18px;
    background:linear-gradient(155deg, var(--surface-2), var(--surface));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    position:relative; z-index:2;
    overflow:hidden;
  }
  .icon-core img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  h1{
    font-family:var(--sans);
    font-weight:600;
    font-size:21px;
    line-height:1.35;
    text-align:center;
    margin-bottom:8px;
  }
  .sub{
    font-size:14px;
    line-height:1.6;
    color:var(--muted);
    text-align:center;
    margin-bottom:20px;
  }
  .sub b{ color:var(--text); font-weight:600; }

  /* version diff chip, git-diff styled */
  .diff{
    font-family:var(--mono);
    font-size:12.5px;
    background:#0D1420;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:18px;
  }
  .diff div{ display:flex; align-items:center; gap:8px; padding:2px 0; }
  .diff .old{ color:var(--red); }
  .diff .new{ color:var(--green); }
  .diff span.mark{ width:12px; opacity:0.8; }

  .changelog{ margin-bottom:24px; }
  .changelog .label{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.1em;
    color:var(--muted);
    margin-bottom:8px;
  }
  .changelog ul{ list-style:none; }
  .changelog li{
    font-size:13.5px;
    color:var(--text);
    padding-left:18px;
    position:relative;
    margin-bottom:6px;
    line-height:1.5;
  }
  .changelog li::before{
    content:'▸';
    position:absolute; left:0; top:0;
    color:var(--cyan);
  }

  .cta{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:var(--cyan);
    color:#06222A;
    font-family:var(--sans);
    font-weight:600;
    font-size:15px;
    padding:14px 18px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 24px -8px rgba(34,211,238,0.55);
  }
  .cta:active{ transform:scale(0.98); }
  .cta:focus-visible{ outline:2px solid var(--cyan); outline-offset:3px; }

  .foot{
    margin-top:14px;
    text-align:center;
    font-size:12px;
    color:var(--muted);
    font-family:var(--mono);
  }
  .foot b{ color:var(--amber); }
</style>
</head>
<body>

<div class="card" role="alertdialog" aria-labelledby="title" aria-describedby="desc">
  <div class="eyebrow">AOV ANDROID V2 · CẬP NHẬT BẮT BUỘC</div>

  <div class="icon-wrap">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="icon-core">
      <img src="https://ipas.cc/_next/image?url=https%3A%2F%2Fdl.ipas.cc%2Ficons%2F1779284211204-IMG_7418.jpeg&w=384&q=75" alt="AOV Android V2" draggable="false">
    </div>
  </div>

  <h1 id="title">⚠️ Bắt buộc cập nhật AOV Android V2</h1>
  <p class="sub" id="desc"><b>AOV Android V2</b> đã có phiên bản mới — phiên bản cũ không còn hoạt động. Vui lòng cập nhật ngay để tiếp tục sử dụng.</p>

  <div class="diff" id="versionDiff"><!-- filled by JS from CONFIG --></div>

  <div class="changelog">
    <div class="label">CÓ GÌ MỚI</div>
    <ul id="changelogList"><!-- filled by JS from CONFIG --></ul>
  </div>

  <a class="cta" id="updateBtn" href="#" rel="noopener">Cập nhật ngay</a>
  <div class="foot" id="footNote"></div>
</div>

<script>
/* ============ CẤU HÌNH — chỉ cần sửa ở đây ============ */
const CONFIG = {
  APP_NAME: "AOV Android V2",
  OLD_VERSION: "v1.0",
  NEW_VERSION: "v2.0",
  CHANGELOG: [
    "Thêm mod rank,Top hetto",
    "1 Số chức năng mới siêu vip",
    "Tối ưu hiệu suất, giảm giật lag",
    "Update Antiban",
    "..."
  ],

  // Link mặc định (desktop / fallback)
  UPDATE_URL: "https://tumadam.com",

  // Có thể trỏ link khác nhau theo nền tảng — để trống nếu không cần
  UPDATE_URL_IOS: "",
  UPDATE_URL_ANDROID: "",

  // Tự động chuyển trang sau N giây (0 = tắt, chỉ dùng nút bấm)
  AUTO_REDIRECT_SECONDS: 0,

  // Chặn nút back của trình duyệt để buộc người dùng cập nhật
  BLOCK_BACK_BUTTON: true
};
/* ======================================================== */

function detectPlatform(){
  const ua = navigator.userAgent || "";
  if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
  if (/Android/i.test(ua)) return "android";
  return "other";
}

function resolveUpdateUrl(){
  const platform = detectPlatform();
  if (platform === "ios" && CONFIG.UPDATE_URL_IOS) return CONFIG.UPDATE_URL_IOS;
  if (platform === "android" && CONFIG.UPDATE_URL_ANDROID) return CONFIG.UPDATE_URL_ANDROID;
  return CONFIG.UPDATE_URL;
}

function render(){
  // version diff
  const diffEl = document.getElementById("versionDiff");
  diffEl.innerHTML = `
    <div class="old"><span class="mark">−</span>${CONFIG.OLD_VERSION}</div>
    <div class="new"><span class="mark">+</span>${CONFIG.NEW_VERSION}</div>
  `;

  // changelog
  const listEl = document.getElementById("changelogList");
  listEl.innerHTML = CONFIG.CHANGELOG.map(item => `<li>${item}</li>`).join("");

  // button
  const btn = document.getElementById("updateBtn");
  const url = resolveUpdateUrl();
  btn.href = url;
  btn.addEventListener("click", (e) => {
    // để lại chỗ gắn tracking nếu cần trước khi điều hướng
    window.location.href = url;
  });

  // footnote / auto redirect
  const foot = document.getElementById("footNote");
  if (CONFIG.AUTO_REDIRECT_SECONDS > 0){
    let remaining = CONFIG.AUTO_REDIRECT_SECONDS;
    foot.innerHTML = `Tự động chuyển sau <b>${remaining}s</b>`;
    const timer = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0){
        clearInterval(timer);
        window.location.href = url;
        return;
      }
      foot.innerHTML = `Tự động chuyển sau <b>${remaining}s</b>`;
    }, 1000);
  } else {
    foot.textContent = "";
  }
}

function blockBack(){
  if (!CONFIG.BLOCK_BACK_BUTTON) return;
  history.pushState(null, "", location.href);
  window.addEventListener("popstate", () => {
    history.pushState(null, "", location.href);
  });
}

render();
blockBack();
</script>

</body>
</html>
