<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Key - LQM Android</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-color: #F0F4F0;
    --card-bg: #FFFFFF;
    --text-primary: #191C1A;
    --text-secondary: #404943;
    --separator: #E0E4E0;
    --active-bg: #E8F0E8;
    --btn-main: #2E7D32;
    --btn-done: #388E3C;
    --orange: #EF6C00;
    --orange-tint: rgba(239, 108, 0, 0.14);
    --red: #D32F2F;
    --blue-icon: #0288D1;
    --modal-bg: #FFFFFF;
    --modal-overlay: rgba(0, 0, 0, 0.5);
    --btn-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
    --theme-btn-bg: #FFFFFF;
    --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
  }

  body.dark-mode {
    --bg-color: #121412;
    --card-bg: #1E201E;
    --text-primary: #E1E3E0;
    --text-secondary: #8B938C;
    --separator: #3F4943;
    --active-bg: #2D312E;
    --btn-main: #4CAF50;
    --btn-done: #66BB6A;
    --orange: #FFA726;
    --orange-tint: rgba(255, 167, 38, 0.18);
    --red: #EF5350;
    --blue-icon: #29B6F6;
    --modal-bg: #1E201E;
    --modal-overlay: rgba(0, 0, 0, 0.7);
    --btn-shadow: 0 4px 12px rgba(76, 175, 80, 0.2);
    --theme-btn-bg: #2D312E;
    --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background-color: var(--bg-color);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 22px 14px;
    transition: background-color 0.4s ease, color 0.4s ease;
    overflow-x: hidden;
  }

  .android-container { width: 100%; max-width: 400px; margin: 0 auto; }

  /* ===== NÚT ĐỔI THEME ===== */
  .theme-toggle-btn {
    position: absolute; top: 14px; right: 14px;
    width: 38px; height: 38px; border-radius: 50%;
    background-color: var(--theme-btn-bg); color: var(--text-primary);
    border: none; font-size: 16px; display: flex; justify-content: center; align-items: center;
    cursor: pointer; box-shadow: var(--card-shadow);
    transition: background-color 0.4s ease, color 0.4s ease, transform 0.2s;
    z-index: 100; opacity: 0;
    animation: dropDownSpring 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards 0.2s;
  }
  @keyframes dropDownSpring {
    0% { opacity: 0; transform: translateY(-30px) scale(0.8); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .theme-toggle-btn:active { transform: scale(0.85) !important; }

  /* ===== ANIMATION XUẤT HIỆN ===== */
  .pop-in { opacity: 0; animation: springPop 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  .delay-1 { animation-delay: 0.05s; } .delay-2 { animation-delay: 0.10s; }
  .delay-3 { animation-delay: 0.15s; } .delay-4 { animation-delay: 0.20s; }
  .delay-5 { animation-delay: 0.25s; } .delay-6 { animation-delay: 0.30s; }
  @keyframes springPop {
    0% { opacity: 0; transform: translateY(28px) scale(0.92); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; }
  }

  /* ===== HEADER GỌN ===== */
  .header-group { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 18px; }
  .glow-wrapper {
    position: relative; width: 40px; height: 40px; border-radius: 10px;
    display: flex; justify-content: center; align-items: center; flex-shrink: 0; z-index: 1;
  }
  .glow-wrapper::before {
    content: ""; position: absolute; inset: -3px; border-radius: 13px;
    background: linear-gradient(130deg,#4CAF50,#00BCD4,#8BC34A,#0288D1,#4CAF50);
    background-size: 300% 300%; z-index: -1; filter: blur(7px); opacity: 0.9;
    animation: androidGlow 3s linear infinite;
  }
  @keyframes androidGlow {
    0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
  }
  .header-icon {
    width: 100%; height: 100%; border-radius: 10px; object-fit: cover;
    z-index: 2; background-color: var(--card-bg); transition: background-color 0.4s ease;
  }
  h1 {
    font-size: 20px; font-weight: 800; color: var(--text-primary); line-height: 1.2;
    opacity: 0; animation: textRunOut 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards 0.1s;
    transition: color 0.4s ease;
  }
  @keyframes textRunOut {
    0% { opacity: 0; transform: translateX(-60px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  /* ===== TIÊU ĐỀ SECTION + PROGRESS ===== */
  .section-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 700; color: var(--text-secondary);
    margin: 0 4px 6px; transition: color 0.4s ease;
  }
  .progress-track {
    width: 100%; height: 6px; background-color: var(--separator);
    border-radius: 3px; overflow: hidden; margin-bottom: 10px;
    transition: background-color 0.4s ease;
  }
  .progress-fill {
    height: 100%; width: 0%; background-color: var(--btn-main); border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.25,0.1,0.25,1), background-color 0.4s ease;
  }

  /* ===== DANH SÁCH NHIỆM VỤ (CARD MATERIAL) ===== */
  .android-list-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .android-list-item {
    display: flex; align-items: center; width: 100%; padding: 13px 14px;
    background-color: var(--card-bg); border: none; border-radius: 14px;
    text-align: left; font-size: 15px; cursor: pointer;
    box-shadow: var(--card-shadow); transition: all 0.2s ease;
  }
  .android-list-item:active:not(:disabled) { transform: scale(0.98); background-color: var(--active-bg); }
  .android-list-item:disabled { cursor: not-allowed; opacity: 0.8; }

  .icon-box {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    color: white; font-size: 15px; margin-right: 12px; flex-shrink: 0;
    transition: opacity 0.3s ease, background-color 0.4s ease;
  }
  .bg-youtube  { background-color: var(--red); }
  .bg-telegram { background-color: var(--blue-icon); }
  .bg-tiktok   { background-color: #010101; }
  .bg-discord  { background-color: #5865F2; }

  .item-text { flex-grow: 1; color: var(--text-primary); font-weight: 600; transition: color 0.4s ease; }
  .item-status { color: var(--text-secondary); font-size: 13px; margin-right: 8px; transition: color 0.4s ease; }
  .item-chevron { color: var(--text-secondary); font-size: 13px; opacity: 0.6; transition: color 0.4s ease; }
  .android-list-item.done .icon-box { background-color: var(--btn-done); }
  .android-list-item.done .item-text { color: var(--btn-done); }
  .android-list-item.done .item-chevron { color: var(--btn-done); opacity: 1; }

  /* ===== NÚT MỞ KHOÁ ===== */
  .btn-unlock {
    width: 100%; border: none; border-radius: 14px; padding: 14px;
    font-size: 15px; font-weight: 700; margin-bottom: 10px;
    display: flex; justify-content: center; align-items: center; gap: 8px;
    background-color: var(--active-bg); color: var(--text-secondary);
    cursor: not-allowed; transition: all 0.3s ease;
  }
  .btn-unlock.active { cursor: pointer; animation: pulseOnce 0.6s ease 1; }
  .btn-unlock.active:active { transform: scale(0.97); }
  .btn-unlock.style-main.active { background-color: var(--btn-main); color: #fff; box-shadow: var(--btn-shadow); }
  .btn-unlock.style-ads.active  { background-color: var(--orange-tint); color: var(--orange); }
  @keyframes pulseOnce {
    0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); }
  }

  /* ===== VIDEO HƯỚNG DẪN ===== */
  .help-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 16px; margin-top: 14px; }
  .help-btn {
    background: none; border: none; color: var(--btn-main); font-size: 13px;
    font-weight: 600; cursor: pointer; display: flex; align-items: center;
    gap: 6px; transition: color 0.4s ease;
  }
  .help-btn:active { opacity: 0.6; transform: scale(0.95); }

  /* ===== MODAL VIDEO ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background-color: var(--modal-overlay); z-index: 9999;
    justify-content: center; align-items: center; padding: 20px;
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  }
  .modal-content {
    width: 100%; max-width: 400px; background: var(--modal-bg);
    border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;
    animation: zoomIn 0.3s cubic-bezier(0.175,0.885,0.32,1.1);
  }
  @keyframes zoomIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .video-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
  .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  .modal-close-btn {
    background-color: transparent; color: var(--btn-main); border: none;
    border-top: 0.5px solid var(--separator); padding: 15px; font-size: 15px;
    font-weight: 700; cursor: pointer;
  }
  .modal-close-btn:active { background-color: var(--active-bg); }
</style>
</head>
<body>

<button class="theme-toggle-btn" id="themeToggleBtn">
  <i class="fa-solid fa-moon" id="themeIcon"></i>
</button>

<div class="android-container">

  <div class="header-group">
    <div class="glow-wrapper pop-in delay-1">
      <img src="https://ipas.cc/_next/image?url=https%3A%2F%2Fdl.ipas.cc%2Ficons%2F1779284211204-IMG_7418.jpeg&w=384&q=75" alt="Game Logo" class="header-icon">

<script>
/* ================= CẤU HÌNH LINK (sửa tại đây) ================= */
const UNLOCK_LINKS = {
  main: 'https://vipmodpro.com/free-key/keytumadam',
  }

const HD_VIDEOS = {
  main: 'https://pub-8851b5874408441f85670cfe38ce6aa7.r2.dev/video%20hd/copy_D9B62E8E-EDE2-422A-BFA6-266509F30DA8.mov',
  ads:  'https://cdn.tumadam.com/files/91fb6774-04bb-4a64-8a8e-0ee5d688c9e5.mov'  // <-- thay bằng video HD vượt link ads
};
/* =============================================================== */

function goUnlock(key) {
  location.href = UNLOCK_LINKS[key];
}

/* ===== AUTO RELOAD KHI VÀO LẠI TRANG (fix BFCache) ===== */
window.addEventListener('pageshow', function (e) {
  const nav = performance.getEntriesByType('navigation')[0];
  if (e.persisted || (nav && nav.type === 'back_forward')) {
    location.reload();
  }
});

/* ===== THEME ===== */
const themeToggleBtn = document.getElementById('themeToggleBtn');
const themeIcon = document.getElementById('themeIcon');

function getSavedTheme() { try { return localStorage.getItem('user-theme'); } catch (e) { return null; } }
function saveTheme(v)    { try { localStorage.setItem('user-theme', v); } catch (e) {} }

function setTheme(isDark) {
  if (isDark) {
    document.body.classList.add('dark-mode');
    themeIcon.className = 'fa-solid fa-sun';
    themeIcon.style.color = '#FBC02D';
  } else {
    document.body.classList.remove('dark-mode');
    themeIcon.className = 'fa-solid fa-moon';
    themeIcon.style.color = '#333';
  }
}
function isNight() { const h = new Date().getHours(); return h >= 18 || h < 6; }

const savedTheme = getSavedTheme();
setTheme(savedTheme ? savedTheme === 'dark' : isNight());

themeToggleBtn.addEventListener('click', () => {
  const dark = !document.body.classList.contains('dark-mode');
  setTheme(dark);
  saveTheme(dark ? 'dark' : 'light');
});

/* ===== NHIỆM VỤ ===== */
let completedSteps = 0;
const TOTAL_STEPS = 4;

function completeTask(step, url) {
  window.open(url, '_blank');
  const btn = document.getElementById('task' + step);
  const statusSpan = document.getElementById('status-task' + step);
  const iconRight = document.getElementById('icon-task' + step);
  btn.disabled = true;

  let countdown = 3;
  statusSpan.textContent = 'Chờ ' + countdown + 's';
  const timer = setInterval(() => {
    countdown--;
    if (countdown > 0) {
      statusSpan.textContent = 'Chờ ' + countdown + 's';
    } else {
      clearInterval(timer);
      btn.classList.add('done');
      statusSpan.textContent = '';
      iconRight.className = 'fa-solid fa-check item-chevron';
      completedSteps++;
      document.getElementById('progressText').textContent = completedSteps + ' / ' + TOTAL_STEPS;
      document.getElementById('progressFill').style.width = (completedSteps / TOTAL_STEPS) * 100 + '%';

      if (step < TOTAL_STEPS) {
        document.getElementById('task' + (step + 1)).disabled = false;
      } else {
        [1, 2].forEach(num => {
          const unlockBtn = document.getElementById('unlockBtn' + num);
          if (unlockBtn) {
            unlockBtn.disabled = false;
            unlockBtn.classList.add('active');
            document.getElementById('unlockIcon' + num).className = 'fa-solid fa-lock-open';
          }
        });
      }
    }
  }, 1000);
}

/* ===== MODAL VIDEO ===== */
function openVideo(videoUrl) {
  document.getElementById('youtubeIframe').src = videoUrl + '?autoplay=1';
  document.getElementById('videoModal').style.display = 'flex';
}
function closeVideo() {
  document.getElementById('videoModal').style.display = 'none';
  document.getElementById('youtubeIframe').src = '';
}
</script>
